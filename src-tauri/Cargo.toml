[package]
name = "kami"
version = "1.14.0"
description = "Kami — sistema pessoal de organização gamificada, 100% local"
edition = "2021"

# Versões maiores fixadas em "2" (decisão 20: Tauri v2). Rode
# `cargo update` na sua máquina pra travar os patches exatos — não
# fiz isso aqui por não ter acesso a crates.io neste ambiente.
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tokio = { version = "1", features = ["time"] }
tauri = { version = "2", features = ["image-png", "tray-icon"] } # image-png: set_icon do ícone na cor de destaque (ICO-01); tray-icon: bandeja (ORG-05)
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
# CONF-08: seletor de pasta da pasta extra das cópias (só o diálogo "abrir", ver capabilities)
tauri-plugin-dialog = "2"
dirs = "7"
# ORG-05: abrir o kami de novo mostra a janela escondida na bandeja; iniciar com o sistema
tauri-plugin-single-instance = "2"
# auto-launch direto (não o tauri-plugin-autostart): só ele deixa fixar o
# início com o sistema no usuário atual — ver janela.rs::inicio_com_sistema
auto-launch = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# DIST-01: aviso de versão nova e atualização pelo app. Sem a feature "zip":
# ela só serve pra pacote de atualização compactado (.zip/.tar.gz, formato
# antigo), e nós publicamos o .exe do NSIS e o AppImage direto — e o crate
# zip 4.x que ela puxa tem falhas (RUSTSEC-2026-0367/0368/0369)
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }

[[bin]]
name = "kami"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
