# SEG-04 (decisão P-21): atualizações de dependências toda semana, num PR
# por ecossistema pro develop — TUDO de cada ecossistema junto, inclusive
# versão maior (a primeira leva, com um PR por versão maior, abriu 13 PRs
# e 26 execuções de CI de uma vez). No máximo 4 PRs por semana; o CI de
# cada um diz se a atualização quebra algo. As actions do GitHub estão
# fixadas por SHA nos workflows, e o Dependabot atualiza o SHA e o
# comentário da versão.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 1
    commit-message: { prefix: "chore(deps)" }
    groups:
      backend:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /src-tauri
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 1
    commit-message: { prefix: "chore(deps)" }
    groups:
      tauri:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 1
    commit-message: { prefix: "chore(deps)" }
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 1
    commit-message: { prefix: "chore(ci)" }
    groups:
      actions:
        patterns: ["*"]
