name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  check-version:
    name: Verify release tag and smoke-test
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate tag, VERSION, and successful smoke-test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "$GITHUB_REF_NAME" = "v${version}"
          git fetch --no-tags origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$main_sha"; then
            echo "A tag de release precisa apontar para um commit integrado em main." >&2
            exit 1
          fi
          runs="$(gh run list --workflow smoke-test.yml --commit "$GITHUB_SHA" --status success --json databaseId)"
          if [[ "$runs" == "[]" ]]; then
            echo "Não existe um Smoke test concluído com sucesso para o commit da release." >&2
            exit 1
          fi

      # MAN-04: versões, CHANGELOG, marcadores e a tag no commit de release
      - name: Check release readiness
        run: ./scripts/conferir-release.sh --tag "$GITHUB_REF_NAME"

      # DIST-01: sem a chave do updater a release sairia sem latest.json e
      # ninguém seria avisado — melhor parar aqui (ver docs/MANUTENCAO.md)
      - name: Check updater signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" || -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]]; then
            echo "Faltam os secrets TAURI_SIGNING_PRIVATE_KEY / _PASSWORD (chave do updater, DIST-01)." >&2
            exit 1
          fi

  build-linux:
    name: Build Linux installers
    needs: check-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # versão em rust-toolchain.toml
        with:
          toolchain: "1.97.1"

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri -> target"

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            libfuse2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Sync the configured version from VERSION
        shell: bash
        run: |
          kami_version="$(tr -d '[:space:]' < VERSION)"
          python - "src-tauri/tauri.conf.json" "$kami_version" <<'PYEOF'
          import json
          import sys

          path, version = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as config_file:
              config = json.load(config_file)
          config["version"] = version
          with open(path, "w", encoding="utf-8") as config_file:
              json.dump(config, config_file, indent=2, ensure_ascii=False)
              config_file.write("\n")
          PYEOF
          sed -i "0,/^version = \".*\"/s//version = \"$kami_version\"/" src-tauri/Cargo.toml

      - name: Build Linux sidecar and installers
        working-directory: src-tauri
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # DIST-01: assina o AppImage pro updater (gera o .AppImage.sig)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          python -m venv ../backend/.venv
          source ../backend/.venv/bin/activate
          python -m pip install -r ../backend/requirements.txt pyinstaller
          bash ../scripts/build_sidecar.sh
          cargo tauri build
          # o .rpm também se atualiza pelo app (plugin do updater + pkexec):
          # precisa do .sig como o AppImage. Assina se o build não gerou.
          for rpm in target/release/bundle/rpm/*.rpm; do
            [ -f "$rpm.sig" ] || cargo tauri signer sign "$rpm"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-installers
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.rpm.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows installer
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # versão em rust-toolchain.toml
        with:
          toolchain: "1.97.1"

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri -> target"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Sync the configured version from VERSION
        shell: bash
        run: |
          kami_version="$(tr -d '[:space:]' < VERSION)"
          python - "src-tauri/tauri.conf.json" "$kami_version" <<'PYEOF'
          import json
          import sys

          path, version = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as config_file:
              config = json.load(config_file)
          config["version"] = version
          with open(path, "w", encoding="utf-8") as config_file:
              json.dump(config, config_file, indent=2, ensure_ascii=False)
              config_file.write("\n")
          PYEOF
          sed -i "0,/^version = \".*\"/s//version = \"$kami_version\"/" src-tauri/Cargo.toml

      - name: Build Windows sidecar and installer
        working-directory: src-tauri
        shell: bash
        env:
          # DIST-01: assina o instalador pro updater (gera o -setup.exe.sig)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          python -m venv ../backend/.venv
          source ../backend/.venv/Scripts/activate
          python -m pip install -r ../backend/requirements.txt pyinstaller
          bash ../scripts/build_sidecar.sh
          cargo tauri build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish assets and checksums
    needs: [build-linux, build-windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-installers
          path: linux-installers

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: windows-installer

      - name: Prepare predictable asset names and SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm
          version="$(tr -d '[:space:]' < VERSION)"
          mkdir release-assets

          deb="$(find linux-installers -type f -name '*.deb' -print -quit)"
          rpm="$(find linux-installers -type f -name '*.rpm' -print -quit)"
          test -s "${rpm}.sig" || { echo "Falta a assinatura do .rpm (${rpm}.sig)." >&2; exit 1; }
          appimage="$(find linux-installers -type f -name '*.AppImage' -print -quit)"
          installer="$(find windows-installer -type f -name '*-setup.exe' -print -quit)"
          test -n "$deb" && test -n "$rpm" && test -n "$appimage" && test -n "$installer"
          deb_package="$(dpkg-deb --field "$deb" Package)"
          rpm_package="$(rpm -qp --queryformat '%{NAME}' "$rpm")"
          if [[ "$deb_package" != "kami" || "$rpm_package" != "kami" ]]; then
            echo "Nome de pacote inesperado: .deb=$deb_package .rpm=$rpm_package (esperado: kami)." >&2
            exit 1
          fi

          cp "$deb" "release-assets/kami-${version}-linux-amd64.deb"
          cp "$rpm" "release-assets/kami-${version}-linux-x86_64.rpm"
          cp "$appimage" "release-assets/kami-${version}-linux-x86_64.AppImage"
          cp "$installer" "release-assets/kami-${version}-windows-x64-setup.exe"
          sed "s/^pkgver=.*/pkgver=${version}/" packaging/arch/PKGBUILD \
            > "release-assets/kami-${version}-PKGBUILD"

          # DIST-01: latest.json, que o app consulta pra avisar de versão
          # nova (endereço em tauri.conf.json › plugins.updater). O AppImage,
          # o instalador do Windows e o .rpm se atualizam pelo app; quem
          # instalou .deb/AUR só recebe o aviso. A assinatura é a do
          # arquivo (o nome publicado muda, o conteúdo não).
          python3 scripts/gerar_latest_json.py \
            --versao "$version" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}" \
            --appimage "kami-${version}-linux-x86_64.AppImage" "${appimage}.sig" \
            --windows "kami-${version}-windows-x64-setup.exe" "${installer}.sig" \
            --rpm "kami-${version}-linux-x86_64.rpm" "${rpm}.sig" \
            --changelog CHANGELOG.md \
            > release-assets/latest.json
          (
            cd release-assets
            # latest.json (DIST-01) também: a conferência do fim exige que
            # TODO arquivo publicado esteja aqui (na 1.14.0 faltou e ela falhou
            # depois de publicar — os arquivos estavam certos)
            sha256sum kami-* latest.json
          ) > release-assets/SHA256SUMS

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          prerelease_args=()
          if [[ "$tag" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          # DIST-02: a página de download diz o que mudou, qual arquivo
          # baixar e, ao lado do .exe, o aviso do SmartScreen com o hash
          python3 scripts/gerar_notas_release.py \
            --versao "${tag#v}" \
            --changelog CHANGELOG.md \
            --sums release-assets/SHA256SUMS \
            > "$RUNNER_TEMP/notas.md"
          gh release create "$tag" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "Kami $tag" \
            --notes-file "$RUNNER_TEMP/notas.md" \
            "${prerelease_args[@]}"

  verify-release:
    name: Download and verify published checksums
    needs: publish
    runs-on: ubuntu-22.04
    steps:
      - name: Download release assets and verify SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-download
          gh release download "$GITHUB_REF_NAME" --dir release-download
          cd release-download
          test -s SHA256SUMS
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' |
            sort > published-assets.txt
          awk '{ print $2 }' SHA256SUMS > checksummed-assets.txt
          printf '%s\n' SHA256SUMS >> checksummed-assets.txt
          sort -o checksummed-assets.txt checksummed-assets.txt
          diff -u published-assets.txt checksummed-assets.txt
          sha256sum --check --strict SHA256SUMS
