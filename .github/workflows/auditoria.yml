name: Auditoria de dependências

# SEG-04: pip-audit (backend), npm audit (frontend) e cargo audit (Tauri)
# em todo PR, em push de release e toda segunda-feira — vulnerabilidade
# nova aparece mesmo sem ninguém mexer no código. Quem decide se falha é
# scripts/auditoria.py: só alta/crítica (ou severidade desconhecida) sem
# exceção registrada em .github/auditoria-excecoes.toml. O resumo vai pra
# página do job.
on:
  pull_request:
    branches: [develop, main, 'release/**']
  push:
    branches: ['release/**']
  schedule:
    - cron: "0 11 * * 1" # segunda, 8h em Brasília
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_AUDIT_VERSION: "0.22.2"
  # sha256 do binário oficial (rustsec/rustsec, release cargo-audit/v0.22.2)
  CARGO_AUDIT_SHA256: "7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428"

jobs:
  auditoria:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: pip-audit (backend)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          # sai com 1 quando acha algo — quem decide é o scripts/auditoria.py
          pip-audit -r backend/requirements.txt -f json -o pip-audit.json || true

      - name: npm audit (frontend, só dependências de produção)
        run: npm audit --omit=dev --json > npm-audit.json || true

      - name: cargo audit (Tauri)
        run: |
          nome="cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}"
          curl -sSfL -o cargo-audit.tgz \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/${nome}.tgz"
          echo "${CARGO_AUDIT_SHA256}  cargo-audit.tgz" | sha256sum -c -
          tar xzf cargo-audit.tgz
          cd src-tauri
          "../${nome}/cargo-audit" audit --json > ../cargo-audit.json || true

      - name: Decidir
        run: |
          python scripts/auditoria.py \
            --pip pip-audit.json --npm npm-audit.json --cargo cargo-audit.json \
            --excecoes .github/auditoria-excecoes.toml

      - name: Guardar os relatórios
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auditoria-relatorios
          path: |
            pip-audit.json
            npm-audit.json
            cargo-audit.json
          if-no-files-found: ignore
